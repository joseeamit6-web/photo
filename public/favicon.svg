<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Midnight Navy Canvas -->
  <rect width="64" height="64" rx="14" fill="#0B1020" />
  
  <!-- 4 Crop Bracket Corners (High contrast for 16x16 / 32x32 / 48x48) -->
  <path d="M 10 21 L 10 13 A 3 3 0 0 1 13 10 L 21 10" fill="none" stroke="#67E8F9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 43 10 L 51 10 A 3 3 0 0 1 54 13 L 54 21" fill="none" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 10 43 L 10 51 A 3 3 0 0 0 13 54 L 21 54" fill="none" stroke="#67E8F9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 43 54 L 51 54 A 3 3 0 0 0 54 51 L 54 43" fill="none" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Square Photograph Frame -->
  <rect x="17" y="17" width="30" height="30" rx="5" fill="#0E1726" stroke="#67E8F9" stroke-width="3" />

  <!-- Central Camera Lens Aperture -->
  <circle cx="32" cy="32" r="9" fill="#0B1020" stroke="#8B5CF6" stroke-width="2.5" />
  <circle cx="32" cy="32" r="4.5" fill="#67E8F9" />
  <circle cx="30" cy="30" r="1.5" fill="#FFFFFF" />
</svg>
