<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');
      .mono-title {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 58px;
        letter-spacing: -0.03em;
        fill: #FFFFFF;
      }
      .mono-bold { font-weight: 700; }
      .mono-light { font-weight: 400; opacity: 0.9; }
    </style>
  </defs>

  <rect width="640" height="160" rx="20" fill="#0B1020" />

  <!-- MONOCHROME GEOMETRIC SYMBOL -->
  <g transform="translate(36, 20)">
    <!-- Four Precision Crop Corners -->
    <path d="M 12 36 L 12 18 A 6 6 0 0 1 18 12 L 36 12" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 84 12 L 102 12 A 6 6 0 0 1 108 18 L 108 36" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 12 84 L 12 102 A 6 6 0 0 0 18 108 L 36 108" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 84 108 L 102 108 A 6 6 0 0 0 108 102 L 108 84" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Square Photograph Frame -->
    <rect x="24" y="24" width="72" height="72" rx="10" fill="none" stroke="#FFFFFF" stroke-width="6" />

    <!-- Camera Lens Aperture -->
    <circle cx="60" cy="60" r="22" fill="#0B1020" stroke="#FFFFFF" stroke-width="5" />
    
    <!-- 6 Iris Blades -->
    <g transform="translate(60, 60)">
      <path d="M 0 -20 L 12 -7 L 6 -4 Z" fill="#FFFFFF" />
      <path d="M 17 -10 L 14 7 L 8 3 Z" fill="#FFFFFF" />
      <path d="M 17 10 L 2 14 L 3 7 Z" fill="#FFFFFF" />
      <path d="M 0 20 L -12 7 L -6 4 Z" fill="#FFFFFF" />
      <path d="M -17 10 L -14 -7 L -8 -3 Z" fill="#FFFFFF" />
      <path d="M -17 -10 L -2 -14 L -3 -7 Z" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="6" fill="#0B1020" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="-2" cy="-2" r="1.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography -->
  <text x="184" y="102" class="mono-title">
    <tspan class="mono-bold">Photo</tspan>
    <tspan dx="14" class="mono-light">Studio</tspan>
  </text>
</svg>
