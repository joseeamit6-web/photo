<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Midnight Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1020" />
    </linearGradient>
    
    <!-- Lens Glow Accent -->
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- App Icon Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Subtle Ambient Glow behind symbol -->
  <circle cx="256" cy="256" r="140" fill="url(#lensGlow)" />

  <!-- 1. Four Precision Crop Corners (Biometric alignment reticle) -->
  <!-- Top-Left (Cyan) -->
  <path d="M 104 164 L 104 116 A 12 12 0 0 1 116 104 L 164 104" fill="none" stroke="#67E8F9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top-Right (Violet) -->
  <path d="M 348 104 L 396 104 A 12 12 0 0 1 408 116 L 408 164" fill="none" stroke="#8B5CF6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Left (Cyan) -->
  <path d="M 104 348 L 104 396 A 12 12 0 0 0 116 408 L 164 408" fill="none" stroke="#67E8F9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Right (Violet) -->
  <path d="M 348 408 L 396 408 A 12 12 0 0 0 408 396 L 408 348" fill="none" stroke="#8B5CF6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 2. Square Photograph Frame with Passport Proportion Cut -->
  <rect x="148" y="148" width="216" height="216" rx="24" fill="#0B1020" fill-opacity="0.8" stroke="#67E8F9" stroke-width="16" />

  <!-- 3. Camera Lens & Iris Blades (Precision Optical Geometry) -->
  <!-- Outer Concentric Lens Element -->
  <circle cx="256" cy="256" r="76" fill="none" stroke="#8B5CF6" stroke-width="10" stroke-opacity="0.6" stroke-dasharray="14 10" />

  <!-- Precision Aperture Iris Ring -->
  <circle cx="256" cy="256" r="60" fill="#0E1726" stroke="#8B5CF6" stroke-width="12" />

  <!-- 6 Geometric Iris Blades in Violet and Cyan -->
  <g transform="translate(256, 256)">
    <!-- Blade 1 -->
    <path d="M 0 -54 L 32 -20 L 16 -12 Z" fill="#8B5CF6" />
    <!-- Blade 2 -->
    <path d="M 46 -26 L 38 18 L 22 8 Z" fill="#67E8F9" />
    <!-- Blade 3 -->
    <path d="M 46 26 L 6 38 L 8 20 Z" fill="#8B5CF6" />
    <!-- Blade 4 -->
    <path d="M 0 54 L -32 20 L -16 12 Z" fill="#67E8F9" />
    <!-- Blade 5 -->
    <path d="M -46 26 L -38 -18 L -22 -8 Z" fill="#8B5CF6" />
    <!-- Blade 6 -->
    <path d="M -46 -26 L -6 -38 L -8 -20 Z" fill="#67E8F9" />
    
    <!-- Central Aperture Opening & Optical Catchlight -->
    <circle cx="0" cy="0" r="16" fill="#0B1020" stroke="#67E8F9" stroke-width="6" />
    <circle cx="-5" cy="-5" r="4" fill="#FFFFFF" />
  </g>
</svg>
