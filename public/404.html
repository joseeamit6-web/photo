<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Passport Photo Studio</title>
  <meta name="description" content="The page you requested could not be found. Return to Passport Photo Studio to create biometric passport and ID photos.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --border: #27272a;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
    }
    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: #0B1020;
      border: 1px solid #312e81;
      border-radius: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.925rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .countdown-box {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      background: rgba(24, 24, 27, 0.8);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem 1rem;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    @media (min-width: 480px) {
      .btn-group {
        flex-direction: row;
      }
    }
    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 0.75rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: #27272a;
      color: var(--text);
      border-color: #3f3f46;
    }
    .btn-secondary:hover {
      background: #3f3f46;
    }
    .cancel-link {
      color: #94a3b8;
      font-size: 0.75rem;
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
    }
    .cancel-link:hover {
      color: #e2e8f0;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="/favicon.svg" alt="Passport Photo Studio Logo" width="44" height="44">
    </div>
    
    <div class="badge">HTTP 404 · Not Found</div>
    
    <h1>Page Not Found</h1>
    <p>
      The link you followed may be broken, or the page may have been moved. Return to the studio to prepare your passport, visa, or identity photos.
    </p>

    <div class="countdown-box" id="countdown-wrapper">
      <span>Auto-redirecting in <strong id="countdown" style="color: #818cf8;">9</strong>s</span>
      <button class="cancel-link" id="cancel-btn" type="button">Cancel redirect</button>
    </div>

    <div class="btn-group">
      <a href="/" class="btn btn-primary">Go to Homepage Now</a>
      <button type="button" class="btn btn-secondary" onclick="window.history.length > 1 ? window.history.back() : window.location.href='/'">Go Back</button>
    </div>
  </div>

  <footer>
    pic.amitjoshi.info.np · Nepal Standard Time
  </footer>

  <script>
    (function() {
      let seconds = 9;
      const countEl = document.getElementById('countdown');
      const wrapperEl = document.getElementById('countdown-wrapper');
      const cancelBtn = document.getElementById('cancel-btn');
      let timer = null;

      function updateCountdown() {
        seconds--;
        if (countEl) countEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(timer);
          window.location.href = '/';
        }
      }

      timer = setInterval(updateCountdown, 1000);

      if (cancelBtn) {
        cancelBtn.addEventListener('click', function() {
          clearInterval(timer);
          if (wrapperEl) {
            wrapperEl.innerHTML = '<span style="color: #a1a1aa;">Auto-redirection cancelled.</span>';
          }
        });
      }
    })();
  </script>
</body>
</html>
