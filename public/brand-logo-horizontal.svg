<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 58px;
        letter-spacing: -0.03em;
      }
      .brand-bold {
        font-weight: 700;
        fill: #FFFFFF;
      }
      .brand-light {
        font-weight: 500;
        fill: #67E8F9;
      }
      .brand-dot {
        fill: #8B5CF6;
      }
    </style>
  </defs>

  <!-- Optional Dark Midnight Canvas -->
  <rect width="640" height="160" rx="20" fill="#0B1020" />

  <!-- SYMBOL MARK (Left: 120x120 viewBox scaled) -->
  <g transform="translate(36, 20)">
    <!-- 1. Four Precision Crop Corners (Size ~120x120) -->
    <!-- Top-Left (Cyan) -->
    <path d="M 12 36 L 12 18 A 6 6 0 0 1 18 12 L 36 12" fill="none" stroke="#67E8F9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Top-Right (Violet) -->
    <path d="M 84 12 L 102 12 A 6 6 0 0 1 108 18 L 108 36" fill="none" stroke="#8B5CF6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bottom-Left (Cyan) -->
    <path d="M 12 84 L 12 102 A 6 6 0 0 0 18 108 L 36 108" fill="none" stroke="#67E8F9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bottom-Right (Violet) -->
    <path d="M 84 108 L 102 108 A 6 6 0 0 0 108 102 L 108 84" fill="none" stroke="#8B5CF6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 2. Square Photograph Frame -->
    <rect x="24" y="24" width="72" height="72" rx="10" fill="#0F172A" stroke="#67E8F9" stroke-width="6" />

    <!-- 3. Camera Lens Aperture -->
    <circle cx="60" cy="60" r="22" fill="#0B1020" stroke="#8B5CF6" stroke-width="5" />
    
    <!-- 6 Iris Blades -->
    <g transform="translate(60, 60)">
      <path d="M 0 -20 L 12 -7 L 6 -4 Z" fill="#8B5CF6" />
      <path d="M 17 -10 L 14 7 L 8 3 Z" fill="#67E8F9" />
      <path d="M 17 10 L 2 14 L 3 7 Z" fill="#8B5CF6" />
      <path d="M 0 20 L -12 7 L -6 4 Z" fill="#67E8F9" />
      <path d="M -17 10 L -14 -7 L -8 -3 Z" fill="#8B5CF6" />
      <path d="M -17 -10 L -2 -14 L -3 -7 Z" fill="#67E8F9" />
      <circle cx="0" cy="0" r="6" fill="#0B1020" stroke="#67E8F9" stroke-width="2.5" />
      <circle cx="-2" cy="-2" r="1.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <text x="184" y="102" class="brand-title">
    <tspan class="brand-bold">Photo</tspan>
    <tspan dx="14" class="brand-light">Studio</tspan>
    <tspan class="brand-dot">.</tspan>
  </text>
</svg>
